schema: "./schema.graphql"       # filen vi laddar ner med download-schema.cjs
documents: "./ClientApp/src/**/*.ts{,x}"   # alla GraphQL queries i ClientApp/src
generates:
  ./ClientApp/src/generated/graphql.ts:
    plugins:
      - "typescript"
      - "typescript-operations"
      - "typescript-react-apollo"
    config:
      withHooks: true
      withHOC: false
      withComponent: false
      skipTypename: false
      reactApolloVersion: 3